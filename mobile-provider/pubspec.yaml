name: khudmati_provider
description: Khudmati – Provider App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.2.0
  dio: ^5.4.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  signalr_netcore: ^1.3.5
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  url_launcher: ^6.2.4
  firebase_core: ^2.27.0
  firebase_messaging: ^14.9.0
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.1.2
  pinput: ^6.0.2
  fl_chart: ^0.68.0
  flutter_stripe: ^10.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FAF0E6"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
