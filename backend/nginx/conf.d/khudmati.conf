# -- HTTP: khudmati.app ? HTTPS redirect ----------------------------------
server {
    listen 80;
    server_name khudmati.app www.khudmati.app;

    location / {
        return 301 https://khudmati.app$request_uri;
    }
}

# -- HTTP: api.khudmati.app ? HTTPS redirect -------------------------------
server {
    listen 80;
    server_name api.khudmati.app;

    location / {
        return 301 https://api.khudmati.app$request_uri;
    }
}

# -- HTTP: bare IP fallback (no domain) ------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /superadmin/ {
        alias /var/www/superadmin/;
        index index.html;
        try_files $uri $uri/ /superadmin/index.html;
    }

    location /api/ {
        proxy_pass         http://api:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /hubs/ {
        proxy_pass             http://api:80;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $connection_upgrade;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# -- HTTPS: khudmati.app � web apps + API ---------------------------------
server {
    listen 443 ssl http2;
    server_name khudmati.app www.khudmati.app;

    ssl_certificate     /etc/letsencrypt/live/khudmati.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khudmati.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /superadmin/ {
        alias /var/www/superadmin/;
        index index.html;
        try_files $uri $uri/ /superadmin/index.html;
    }

    location /api/ {
        proxy_pass         http://api:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /hubs/ {
        proxy_pass             http://api:80;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $connection_upgrade;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    location /api/payments/webhook {
        proxy_pass              http://api:80;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

