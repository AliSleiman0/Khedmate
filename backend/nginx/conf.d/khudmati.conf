# ── HTTP: serve on port 80 + ACME challenge for Let's Encrypt ─────────────
server {
    listen 80;
    server_name api.khudmati.app;

    # Let's Encrypt ACME challenge (used once to issue cert)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS once cert is issued
    # (comment this out during initial cert issuance)
    location / {
        return 301 https://$host$request_uri;
    }
}

