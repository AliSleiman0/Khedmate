<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Khudmati Home — 3 Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#f0eee9; font-family: Inter, Cairo, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  /* hide scrollbars inside the phone frames for a native feel */
  .phone-scroll::-webkit-scrollbar { display: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>
<script type="text/babel" src="direction-b.jsx"></script>
<script type="text/babel" src="direction-c.jsx"></script>

<script type="text/babel">
/*EDITMODE-BEGIN*/const TWEAKS = {
  "language": "ar",
  "showTweaks": false
}/*EDITMODE-END*/;

function PhoneShell({ children }) {
  // Khudmati-branded Android-style frame (simpler than starter, to own the
  // status bar area inside the design so status text color is correct).
  return (
    <div style={{
      width: 390, height: 812, borderRadius: 44,
      background: '#0d0d0d', padding: 8,
      boxShadow: '0 40px 90px -30px rgba(20,30,40,0.45), 0 0 0 1px rgba(0,0,0,0.2)',
      position: 'relative',
    }}>
      <div style={{
        width: '100%', height: '100%', borderRadius: 36, overflow: 'hidden',
        background: '#fff', position: 'relative',
      }} className="phone-scroll">
        {/* Dynamic island */}
        <div style={{
          position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)',
          width: 110, height: 28, borderRadius: 20, background: '#000', zIndex: 99,
        }}/>
        {children}
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = React.useState(() => {
    const saved = localStorage.getItem('kh-lang');
    return saved || TWEAKS.language || 'ar';
  });
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => { localStorage.setItem('kh-lang', lang); }, [lang]);
  const rtl = lang === 'ar';

  // Tweaks integration
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setLangPersist = (v) => {
    setLang(v);
    window.parent.postMessage({
      type: '__edit_mode_set_keys', edits: { language: v },
    }, '*');
  };

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="khudmati-home"
          title={rtl ? 'خدمتي · الشاشة الرئيسية' : 'Khudmati · Home Screen'}
          subtitle={rtl
            ? 'ثلاث اتجاهات تصميمية — من الأكثر هدوءاً إلى الأكثر تفاعلاً'
            : 'Three design directions — from calmest to most interactive'}>
          <DCArtboard
            id="a"
            label={rtl ? 'أ · المحرر الفاخر' : 'A · Editorial Concierge'}
            width={406} height={828}>
            <PhoneShell><DirA rtl={rtl}/></PhoneShell>
          </DCArtboard>
          <DCArtboard
            id="b"
            label={rtl ? 'ب · مباشر وبلمسة' : 'B · Live & Tactile'}
            width={406} height={828}>
            <PhoneShell><DirB rtl={rtl}/></PhoneShell>
          </DCArtboard>
          <DCArtboard
            id="c"
            label={rtl ? 'ج · اسأل خدمتي' : 'C · Ask Khudmati'}
            width={406} height={828}>
            <PhoneShell><DirC rtl={rtl}/></PhoneShell>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      {/* Floating lang toggle — always on (primary tweak for this project) */}
      <div style={{
        position: 'fixed', top: 16, left: 16, zIndex: 1000,
        background: '#fff', border: '1px solid #e8e2d7', borderRadius: 12,
        padding: 4, display: 'flex', gap: 2,
        boxShadow: '0 8px 20px -8px rgba(0,0,0,0.15)',
      }}>
        {[
          { v: 'ar', label: 'عربي', font: 'Cairo' },
          { v: 'en', label: 'English', font: 'Inter' },
        ].map(o => (
          <button key={o.v} onClick={() => setLangPersist(o.v)} style={{
            padding: '6px 12px', borderRadius: 8, border: 'none', cursor: 'pointer',
            background: lang === o.v ? '#1B4F72' : 'transparent',
            color: lang === o.v ? '#fff' : '#5D534A',
            fontFamily: o.font, fontSize: 13, fontWeight: 700,
          }}>{o.label}</button>
        ))}
      </div>

      {/* Tweaks panel */}
      {tweaksOpen && (
        <div style={{
          position: 'fixed', bottom: 20, right: 20, zIndex: 1000, width: 260,
          background: '#fff', border: '1px solid #e8e2d7', borderRadius: 16,
          padding: 16, boxShadow: '0 20px 40px -15px rgba(0,0,0,0.25)',
          fontFamily: 'Inter, system-ui',
        }}>
          <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 12 }}>Tweaks</div>
          <div style={{ fontSize: 11, color: '#8E857B', fontWeight: 600, marginBottom: 6 }}>LANGUAGE / DIRECTION</div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
            {[
              { v: 'ar', label: 'Arabic (RTL)' },
              { v: 'en', label: 'English (LTR)' },
            ].map(o => (
              <button key={o.v} onClick={() => setLangPersist(o.v)} style={{
                flex: 1, padding: '8px', borderRadius: 8,
                border: `1px solid ${lang === o.v ? '#1B4F72' : '#e8e2d7'}`,
                background: lang === o.v ? '#1B4F72' : '#fff',
                color: lang === o.v ? '#fff' : '#1C1713',
                fontSize: 11, fontWeight: 700, cursor: 'pointer',
              }}>{o.label}</button>
            ))}
          </div>
          <div style={{ fontSize: 11, color: '#8E857B', lineHeight: 1.5 }}>
            Toggle language to see the layout flip between RTL (Cairo) and LTR (Inter). All three directions are RTL-first.
          </div>
        </div>
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
