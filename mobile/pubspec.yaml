name: mobile
description: Khudmati – Unified Mobile App (Customer + Provider)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.2.0
  dio: ^5.4.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  signalr_netcore: ^1.3.5
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pinput: ^6.0.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  lottie: ^3.1.0
  flutter_stripe: ^10.1.1
  url_launcher: ^6.2.4
  firebase_core: ^2.27.0
  firebase_messaging: ^14.9.0
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.68.0
  intl: ^0.20.2
  app_links: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

# Pin path_provider_android to the pre-jni version used by the legacy apps.
# path_provider_android 2.3.1 introduces a hard dependency on `jni: ^1.0.0`, which
# pub.dev cannot currently stream reliably from this machine. Reverting to 2.2.23
# (the version both legacy apps locked) keeps the scaffold buildable without jni.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
