org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dcom.sun.net.ssl.checkRevocation=false -Djdk.security.certpath.ocspEnabled=false -Djdk.tls.client.enableStatusRequestExtension=false
android.useAndroidX=true

# Network timeout settings for Gradle artifact downloads (ms)
systemProp.sun.net.client.defaultReadTimeout=300000
systemProp.sun.net.client.defaultConnectTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=60000

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
